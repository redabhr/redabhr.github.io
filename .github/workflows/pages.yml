name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated player and production policy
        run: |
          npm run build:video-player
          npm run check:csp

      - name: Assemble public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html CNAME favicon.ico robots.txt sitemap.xml _site/
          cp -R css js fonts media _site/
          test ! -e _site/scripts
          test ! -e _site/workers
          test ! -e _site/package.json
          test ! -e _site/.env

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
