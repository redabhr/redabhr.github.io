name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Run automated quality and dependency checks
        run: |
          npm audit --omit=dev
          npm test --prefix workers/video-token
          npm audit --prefix workers/video-token

      - name: Verify generated player and production policy
        run: |
          npm run build:video-player
          npm run build:mux-data
          npm run check:csp
          npm run check:html

      - name: Assemble minified public artifact
        run: npm run build:pages
        env:
          MUX_DATA_ENV_KEY: ${{ vars.MUX_DATA_ENV_KEY }}

      - name: Verify artifact boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e _site/scripts
          test ! -e _site/workers
          test ! -e _site/package.json
          test ! -e _site/.env
          test ! -e _site/js/redabhr.js.map
          test ! -e _site/css/redabhr.css.map
          npm run check:artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser compatibility tests
        run: npm run test:browsers

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
